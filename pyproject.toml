[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seacrime"
version = "0.1.0"
description = "Seattle area-level crime forecasting research platform (aggregated, non-individual)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "statsmodels>=0.14",
  "lightgbm>=4.3",
  "requests>=2.31",
  "pyyaml>=6",
  "pyproj>=3.6",
  "shapely>=2.0",
  "geopandas>=1.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
catboost = ["catboost>=1.2"]
deep = ["torch>=2.2"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: needs downloaded data (skipped in CI unless SEACRIME_DATA_TESTS=1)"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["B008", "B905"]
